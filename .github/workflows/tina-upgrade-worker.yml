name: Tina upgrade worker

on:
  push:
    branches:
      - chore/tina-upgrade-worker
    paths:
      - .github/workflows/tina-upgrade-worker.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Upgrade Tina packages
        run: npm install tinacms@3.12.1 @tinacms/cli@2.6.1 @tinacms/astro@0.6.1 --save
      - name: Verify Tina versions
        run: npx tinacms doctor --json
      - name: Regenerate Tina lock
        run: npx tinacms build --local --skip-cloud-checks --noTelemetry
      - name: Build Astro site
        run: npm run build:astro
      - name: Commit generated upgrade files to worker branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tina/tina-lock.json
          git commit -m "Generate Tina dependency upgrade"
          git push
